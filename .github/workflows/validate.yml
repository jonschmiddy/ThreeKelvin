name: Validate

# Runs on every pull request into main, and again on main itself so a merge
# that only breaks in combination still reports. Branch protection is what
# actually blocks a merge — see CLAUDE.md; a workflow alone only advises.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sim_runs:
        description: "How many runs the simulator plays"
        default: "40"

# A second push supersedes the first. Nothing here is worth finishing for a
# commit that has already been replaced.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # The script imposes its own per-step limits; this is the backstop for
    # anything that hangs outside them, such as the Godot download.
    timeout-minutes: 25

    env:
      # Must match what the project is developed against. Godot is strict about
      # the class cache format, and a mismatch here fails in ways that look like
      # code errors rather than like a version problem.
      GODOT_VERSION: 4.7.1
      # Fewer runs than a balance pass (200), enough to catch a run that
      # crashes or wedges. Raise it by hand from the Actions tab when tuning.
      SIM_RUNS: ${{ github.event.inputs.sim_runs || '40' }}
      # Somewhere upload-artifact can find them without globbing /tmp.
      LOG_DIR: ${{ github.workspace }}/ci-logs

    steps:
      - uses: actions/checkout@v4

      - name: Cache the Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          NAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${NAME}.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/"$NAME" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Report the Godot version actually in use
        run: ~/godot-bin/godot --headless --version

      - name: Validate
        run: GODOT="$HOME/godot-bin/godot" .github/scripts/validate.sh

      - name: Keep the logs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-logs
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 14
