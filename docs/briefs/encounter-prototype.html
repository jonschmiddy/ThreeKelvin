<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Kelvin — sector screen prototype</title>
<style>
:root{
  --void:#0a0e15; --panel:#111823; --panel2:#161f2c; --line:#22303f;
  --cold:#6b7d94; --chill:#8fa3ba; --ice:#c3d2e2;
  --ember:#d97b29; --flare:#ff9d3d; --hot:#ffd28a;
  --good:#7fb89a; --leave:#d4614f; --quote:#5a6470;
  --bevel-hi:#3d4d61; --bevel-lo:#080b11; --them:#c98d7a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--void);color:var(--chill)}
body{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13px; line-height:1.55;
  padding:20px 14px 60px;
  -webkit-font-smoothing:none;
}
.wrap{max-width:760px;margin:0 auto}

/* ---- chrome ---- */
.eyebrow{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--quote);margin:0 0 14px
}
.panel{
  background:var(--panel);
  border-top:1px solid var(--bevel-hi);
  border-left:1px solid var(--bevel-hi);
  border-right:1px solid var(--bevel-lo);
  border-bottom:1px solid var(--bevel-lo);
  padding:14px 16px;margin-bottom:12px;
}

/* ---- system header ---- */
.sys-name{
  font-size:20px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ice);margin:0 0 8px;font-weight:400
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line);color:var(--cold);
  background:var(--panel2)
}
.chip.danger{color:var(--flare);border-color:#4a3520}
.chip.berth{color:var(--hot);border-color:#4a3a20}
.flavour{color:var(--cold);margin:0;font-style:italic}

/* ---- option rows ---- */
.group{
  border:1px dashed var(--line);padding:10px 12px 4px;margin:14px 0;position:relative
}
.group-label{
  position:absolute;top:-8px;left:10px;background:var(--panel);
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--quote);
  padding:0 6px
}
.opt{
  border-left:2px solid transparent;padding:9px 12px;margin:6px 0;
  cursor:pointer;transition:background .09s,border-color .09s,opacity .12s;
  background:transparent;
}
.opt:hover:not(.spent):not(.locked):not(.gated){
  background:var(--panel2);border-left-color:var(--ember)
}
.opt-body{color:var(--cold);font-size:12px;margin:0 0 4px}
.full{margin:8px 0 10px;border-left:1px solid var(--line);padding-left:12px}
.full p{margin:0 0 7px;color:var(--chill);font-size:12.5px;line-height:1.6}
.full p:last-child{margin-bottom:0}
.opt-label{
  color:var(--ice);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0
}
.badge{
  font-size:10px;letter-spacing:.09em;color:var(--quote);margin-top:5px;
  text-transform:uppercase
}
.badge .have{color:var(--chill)}
.badge .odds{color:var(--hot)}
.badge .certain{color:var(--good)}
.badge .more{color:var(--quote);margin-left:8px}
.badge.cant{color:var(--leave)}

/* foreclosure preview — the signature interaction */
.opt.dimmed{opacity:.3}
/* Space is RESERVED, never created. Toggling display here shoved every row
   below it down the page — the panel appeared to shake. visibility keeps the
   line in the layout and only changes whether it is painted. */
.warn{
  visibility:hidden;color:var(--leave);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;margin-top:5px
}
.opt.dimmed .warn{visibility:visible}
.opt.spent,.opt.locked,.opt.gated{cursor:default;opacity:.42}
.opt.spent{opacity:1}
.locked-why,.gated-why{
  color:var(--leave);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;margin-top:5px
}
.outcome{
  border-left:2px solid var(--ember);background:var(--panel2);
  padding:9px 12px;margin:6px 0
}
.band{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 5px
}
.band.met{color:var(--good)}
.band.clean{color:var(--chill)}
.band.partial{color:var(--hot)}
.band.botched{color:var(--leave)}
.band.flat{color:var(--cold)}
.outcome p{margin:0;color:var(--ice);font-size:12px}
.ledger{margin-top:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ledger .up{color:var(--good)}
.ledger .down{color:var(--leave)}

/* ---- leave ---- */
.leave-btn{
  display:block;width:100%;margin-top:16px;padding:11px;
  background:var(--panel2);color:var(--cold);
  border-top:1px solid var(--bevel-hi);border-left:1px solid var(--bevel-hi);
  border-right:1px solid var(--bevel-lo);border-bottom:1px solid var(--bevel-lo);
  font:inherit;font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  cursor:pointer
}
.leave-btn:hover{background:#243244;color:var(--ice)}

/* ---- ship strip ---- */
.ship{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:10px}
.gauge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--quote)}
.gauge b{display:block;font-size:16px;letter-spacing:.06em;color:var(--ice);font-weight:400}
.gauge.heat b{color:var(--flare)}
.attrs{display:flex;flex-wrap:wrap;gap:10px}
.attr{
  display:flex;align-items:center;gap:6px;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--quote)
}
.attr input{
  width:46px;background:var(--void);color:var(--ice);border:1px solid var(--line);
  font:inherit;font-size:12px;padding:1px 4px;text-align:center
}
.hint{color:var(--quote);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  background:var(--panel);color:var(--cold);border:1px solid var(--line);
  font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 10px;cursor:pointer
}
.tab.on{color:var(--hot);border-color:#4a3a20;background:var(--panel2)}
.log{color:var(--quote);font-size:11px;margin-top:14px;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<p class="eyebrow">Three Kelvin · sector screen · prototype</p>

<div class="panel">
  <div class="ship" id="ship"></div>
  <div class="attrs" id="attrs"></div>
  <p class="hint" style="margin:10px 0 0">Attributes are editable — change one and the badges move with it.</p>
</div>

<div class="tabs" id="tabs"></div>

<div class="panel">
  <h1 class="sys-name" id="sysname"></h1>
  <div class="chips" id="chips"></div>
  <p class="flavour" id="flavour"></p>
  <div id="options"></div>
  <button class="leave-btn" id="leave">Plot next jump</button>
</div>

<div class="log" id="log"></div>

</div>
<script>
// ---------------------------------------------------------------- SkillCheck
// Ported verbatim from scripts/systems/SkillCheck.gd
const ODDS = [1.0, 0.65, 0.40, 0.20, 0.05];
const shortfall = (need, have) => Math.max(0, need - have);
const oddsFor = (need, have) => ODDS[Math.min(shortfall(need, have), ODDS.length - 1)];
function roll(need, have){
  if (shortfall(need, have) <= 0) return "MET";
  const p = oddsFor(need, have), r = Math.random();
  if (r < p) return "CLEAN";
  return r < p + (1 - p) * 0.5 ? "PARTIAL" : "BOTCHED";
}

// ---------------------------------------------------------------- ship
const ship = { hull:34, maxHull:40, fuel:212, credits:118, heat:6,
  attrs:{ hull:4, thrust:5, maneuver:3, thermal:4, sensors:3, stealth:4 } };

// ---------------------------------------------------------------- content
// Options as authored in batch-02-draft.md.
const SYSTEMS = [
{

        { label:"File a third claim", check:{attr:"sensors", need:5},

            MET:["Your filing is cleaner than either of theirs and predates the dispute by exactly as long as it took you to write it. The wreck is yours on paper before you touch it.", {module:1, credits:35}],

            PARTIAL:["The board accepts it and one claimant contests it within the hour. You take what you can carry and draft a reply you will never send.", {credits:45}],
            BOTCHED:["You file into the middle of a dispute that now has three parties and a docket number. The fee is not refundable.", {credits:-25}] } },
        { label:"Leave it to them", decline:true,
          flat:"Two claims, one wreck, an office each." } ] },

    { id:"still_under_warranty", group:"wreck",
      body:"A dead hauler, still billing itself for maintenance.", label:"Still under warranty",
      full:"A hauler went down here long enough ago that the ice on it has ice on it. Nothing aboard is alive and nothing aboard is under power — except a service transponder, which has been billing a dead ship for its scheduled maintenance since before you were flying.\n\nVerity fit them as standard. They tend to outlast the warranty, the ship, and the owner.",
      quote:"COVERAGE CONTINUES. THE HOLDER IS ADVISED THAT COVERAGE IS NOT CONTINGENT UPON THE CONTINUED EXISTENCE OF THE HOLDER.",
      choices:[
        { label:"Answer the notice",
          flat:"You transmit your own registry against the loop. Something at the far end of a very long chain accepts it, and the loop stops.",
          gain:{module:1, credits:20} },
        { label:"Strip it and say nothing", check:{attr:"stealth", need:4},
          bands:{
            MET:["You take the plate off first. Whatever the loop was reporting to receives nothing further, ever.", {module:1}],
            CLEAN:["You take the racks and leave the plate where it is.", {module:1}],
            PARTIAL:["The loop logs a registry on its way past. Yours. You are gone before anything answers, and something will.", {module:1, credits:-20}],
            BOTCHED:["The loop logs your registry, your heading, and the eleven minutes you spent aboard.", {module:1, credits:-45}] } },
        { label:"Leave it transmitting", decline:true,
          flat:"It has been saying that for a while. It will keep saying it." } ] },

    { id:"cordon",
      body:"Someone has fenced a wreck and is charging to see it.", label:"The cordon",
      full:"Four hulls strung on cable around a debris field, close enough that nothing bigger than a courier gets between them. They did not put the wreck there. They got here first and decided that was the same as owning it, and they have been at it long enough to have a rate card.\\n\\nBehind the cable is a bulk hauler's spine with the holds still sealed.",
      choices:[
        { label:"Pay the rate", gate:{credits:60},
          flat:"Sixty credits and a wave from a man in a chair. They open the cable, watch you work, and close it behind you.",
          gain:{credits:-60, module:1} },
        { label:"Slip the cable", check:{attr:"thrust", need:6},
          bands:{
            MET:["You are inside the ring before the ring is past discussing it, and out again with a rack off the spine.", {module:1}],
            CLEAN:["They get a burn off as you leave. You keep the rack and the tank shows the sprint.", {module:1, fuel:-14}],
            PARTIAL:["You get in, get nothing, and spend the exit at full burn on the wide side of the field.", {fuel:-26}],
            BOTCHED:["You cross the ring twice, both times flat out, the second time for no reason either of you could name afterwards.", {fuel:-40}] } },
        { label:"Cut the cable", fight:true,
          flat:"They are not expecting a ship that came out here to do this." },
        { label:"Leave them to it", decline:true,
          flat:"Four hulls, one wreck, and a rate card. Somebody will pay it." } ] }
  ]
},
{
  name:"Tolbeck Crossing", region:"COSMOPOLITAN", danger:6, security:4, berths:["Probate","Calyx","Cygnet"],
  flavour:"Three offices, one lane, and a queue at every counter.",
  options:[
    { id:"weighing", group:"berth",
      body:"Two offices, two scales, and a third of a cargo between them.", label:"The weighing",
      full:"A hauler has a hold of reclaimed coolant and two offices willing to buy it, and their scales disagree by a third. Both quotes are honest — each office weighed what it weighed. Only one of them is right.\n\nShe cannot get it weighed twice; the seals break on the first reading. She needs somebody with no berth here to stand between the two counters and say which instrument is lying.",
      choices:[
        { label:"Stand as her witness", check:{attr:"sensors", need:5},
          bands:{
            MET:["You read both scales off their own telemetry before either office opens its mouth. The low one recalibrates without being asked, and nobody says the word error. She pays you out of the difference.", {credits:45}],
            CLEAN:["You catch the discrepancy but not its direction. The offices settle it between themselves, courteously, at a table you are not at. She pays you for the afternoon.", {credits:22}],
            PARTIAL:["Your figures agree with neither of theirs. A third number turns a disagreement into a procedure, and the procedure takes the rest of the day.", {credits:8}],
            BOTCHED:["You certify the wrong scale. It is corrected inside the hour, the correction carries your registry, and you return the fee.", {credits:-15}] } },
        { label:"Take the low quote and haul it yourself",
          flat:"Her cargo, your hold, the cheaper office. She keeps the difference and you keep the work.",
          gain:{credits:18} },
        { label:"Leave them to it", decline:true,
          flat:"Two offices and a scale each. It will be settled by people who file for a living." } ] },

    { id:"countersign", group:"berth",
      body:"A clerk needs a signature from someone with no stake here.", label:"Countersign",
      full:"She hails you on a private band rather than the dock channel, which is the first thing worth noticing. The second is that she is not asking for money and not offering much.\n\nThe document needs a second signature from someone with no berth on this station and no interest in the outcome. That is a narrow description and you fit it. She says she will remember it, and says it like a woman who does.",
      choices:[
        { label:"Sign it",
          flat:"You do not read it closely. That is the arrangement. A name at this station will recognise yours.",
          gain:{credits:15}, places:"clerk_owes" },
        { label:"Read it first", check:{attr:"sensors", need:4},
          bands:{
            MET:["A routine transfer with one clause that is not routine, and the clause is in your favour. You sign, and you know why.", {credits:40}, "clerk_owes"],
            CLEAN:["Routine. You sign.", {credits:15}, "clerk_owes"],
            PARTIAL:["Half of it is in a register you do not read. You sign anyway, which is what she expected, and she notes how long it took.", {credits:15}, "clerk_owes"],
            BOTCHED:["You take long enough that she withdraws it, pleasantly, and files it alone.", {}] } },
        { label:"Decline", decline:true,
          flat:"She files it alone, which she was always going to have to do." } ] },

    { id:"customs_cordon",
      body:"A revenue cutter sitting on a seized hull.", label:"Customs cordon",
      full:"A revenue cutter with two cold escorts off her flanks, holding station over a hull she took nine days ago. The seizure is still in processing, which means the manifest is public, which is how you know what is still aboard it.\\n\\nThey are not stopping you. They are just here, and so is it.",
      choices:[
        { label:"Board her dark", check:{attr:"stealth", need:4},
          bands:{
            MET:["You go across cold and silent, close enough to read the cutter's hull number on the way past. They never look up, and the seized hold is exactly as public as its manifest said.", {module:1, credits:30}],
            CLEAN:["You hold everything off but the reactor, and the reactor is what you pay with. One rack, six heat, no questions.", {module:1, heat:6}],
            PARTIAL:["They get a partial return and hail you in before you reach it. The fine is forty credits and a lecture.", {credits:-40}],
            BOTCHED:["They light you up from two sides, and something in the cutter's escort decides you are worth the trouble.", {credits:-40, fight:true}] } },
        { label:"Hail them and ask", decline:true,
          flat:"You raise the cutter, ask what she is sitting on, and get told. It costs an afternoon and nothing else, and the hold stays sealed." } ] }
  ]
},
{
  name:"Aster Shelf", region:"FRONTIER", danger:2, security:1, berths:[],
  flavour:"Nobody has been through here in a while. It shows.",
  options:[
    { id:"long_claim",
      body:"An unfiled seam, and a day to work it.", label:"The long claim",
      full:"A shelf of exotic-bearing rock, unfiled, because filing costs more than this much of it is worth and nobody comes out this far on spec. The seam is shallow and the good part of it runs under an overhang that has been deciding whether to come down for a very long time.\n\nA day of cutting. Nothing here is in a hurry and nothing here is coming to help.",
      choices:[
        { label:"Work it",
          flat:"Most of a day, one cutting head, and enough off the seam to matter at the next station.",
          gain:{credits:30, exotic:1} },
        { label:"Work it hard", check:{attr:"hull", need:4},
          bands:{
            MET:["You take the seam and the shelf under it, and the frame does not complain once.", {credits:45, exotic:2}],
            CLEAN:["You take more than the seam. Something in the forward bracing makes a noise it has not made before, then stops.", {exotic:2, hull:-3}],
            PARTIAL:["The shelf comes away wrong and takes the cutting head with it. You get half of what you came for and you are cutting by hand after that.", {exotic:1, hull:-6}],
            BOTCHED:["You are still under the overhang when the overhang decides.", {hull:-12}] } },
        { label:"Move on", decline:true,
          flat:"It has been here a long time. It is in no hurry." } ] },

    { id:"ghost_signal",
      body:"A carrier under the hiss, too regular to be a star.", label:"Ghost signal",
      full:"There is a carrier under the background hiss on this bearing. Too regular to be a star, too weak to be a station, and it has not moved in the eleven minutes you have been listening to it.\n\nResolving it means holding station and giving the dish everything, which is time you are not spending going anywhere.",

            CLEAN:["You pull one clean bearing out of the noise before it drifts. One system, named.", {sensed:1}],

    { id:"slipping_orbit",

            CLEAN:["The engines find it, eventually, and drink fourteen units doing it.", {fuel:-14}],
            PARTIAL:["You get out. The tank shows what it cost and you decide not to look at it again.", {fuel:-26}],
            BOTCHED:["You skim the upper atmosphere on the way up. Forty units, and most of your paint.", {fuel:-40}] } },
        { label:"Ride it round", decline:true,
          flat:"One slow orbit, no burn. It costs you nothing but the hour." } ] }
  ]
},
{
  "name": "Vane Drift",
  "region": "FAUNA",
  "danger": 3,
  "security": 1,
  "berths": [],
  "flavour": "Something is moving through, and it is not weather.",
  "options": [
   {
    "id": "the_braid",
    "body": "Something large is moving through, and moving fast.",
    "label": "The braid",
    "full": "Nine of them, in line, big enough that the dish reads them as terrain. They are running a migration lane they have been running since before anyone was out here to name it, and they are shedding a wake you could ride most of the way to the next shell.\n\nThey are not hostile. They are also not paying attention, and the smallest of them is longer than your ship.",

     {

       "MET": [

         "fuel": 18
        }
       ],
       "CLEAN": [

        {
         "fuel": 11
        }
       ],

        {
         "fuel": -8

    "choices": [
     {
      "label": "Feel your way in",

     {

   {
    "id": "ice",
    "body": "A cometary body, unclaimed, mostly volatiles.",
    "label": "Ice",
    "full": "A dirty snowball on a long ellipse, three kilometres of it, and nobody has ever bothered because there is nothing out here to sell it to. It is water and volatiles and a little metal, packed in a crust that has been hardening since the system was warm.\n\nCutting into it is honest work and slightly stupid work. The crust is under compression and it has opinions about being cut.",

     {

      },
      "bands": {

 {

// ---------------------------------------------------------------- state
let sysIndex = 0;
let taken = {};        // optionId -> outcome html
let spentGroups = {};  // group -> optionId that closed it
let logLines = [];

const ATTR_LABEL = {hull:"Hull",thrust:"Thrust",maneuver:"Maneuver",
  thermal:"Thermal",sensors:"Sensors",stealth:"Stealth"};

function fmtLedger(g){
  const bits = [];
  const push = (n, label, invert) => {
    if (n === undefined || n === 0) return;
    const good = invert ? n < 0 : n > 0;
    bits.push(`<span class="${good?'up':'down'}">${n>0?'+':''}${n} ${label}</span>`);
  };
  push(g.credits,"credits"); push(g.fuel,"fuel"); push(g.hull,"hull");
  push(g.heat,"heat",true); push(g.exotic,"exotic");
  if (g.module) bits.push(`<span class="up">+${g.module} module</span>`);
  if (g.sensed) bits.push(`<span class="up">${g.sensed} system${g.sensed>1?'s':''} charted</span>`);
  if (g.fight) bits.push(`<span class="down">fight</span>`);
  return bits.join(" · ");
}

function applyGain(g){
  if(!g) return;
  if(g.credits) ship.credits += g.credits;
  if(g.fuel) ship.fuel = Math.max(0, ship.fuel + g.fuel);
  if(g.hull) ship.hull = Math.max(0, ship.hull + g.hull);
  if(g.heat) ship.heat += g.heat;
}

function badgeHTML(check){
  const have = ship.attrs[check.attr], need = check.need;
  const name = ATTR_LABEL[check.attr].toUpperCase();
  if (have >= need)
    return `<div class="badge">${name} ${need} · <span class="have">you have ${have}</span> · <span class="certain">certain</span></div>`;
  const pct = Math.round(oddsFor(need, have) * 100);
  const next = Math.round(oddsFor(need, have + 1) * 100);
  return `<div class="badge">${name} ${need} · <span class="have">you have ${have}</span> · <span class="odds">${pct}%</span><span class="more">one more: ${next}%</span></div>`;
}

function render(){
  const sys = SYSTEMS[sysIndex];

  // tabs
  document.getElementById("tabs").innerHTML = SYSTEMS.map((s,i)=>
    `<button class="tab ${i===sysIndex?'on':''}" data-sys="${i}">${s.name}</button>`).join("");

  // ship
  document.getElementById("ship").innerHTML = `
    <div class="gauge">Hull<b>${ship.hull}/${ship.maxHull}</b></div>
    <div class="gauge">Fuel<b>${ship.fuel}</b></div>
    <div class="gauge">Credits<b>${ship.credits}</b></div>
    <div class="gauge heat">Heat<b>${ship.heat}</b></div>`;
  document.getElementById("attrs").innerHTML = Object.keys(ship.attrs).map(a=>
    `<label class="attr">${ATTR_LABEL[a]}
      <input type="number" min="0" max="10" value="${ship.attrs[a]}" data-attr="${a}"></label>`).join("");

  // header
  document.getElementById("sysname").textContent = sys.name;
  document.getElementById("chips").innerHTML =
    `<span class="chip">${sys.region}</span>
     <span class="chip danger">danger ${sys.danger}</span>
     <span class="chip">security ${sys.security}</span>` +
    sys.berths.map(b=>`<span class="chip berth">${b}</span>`).join("");
  document.getElementById("flavour").textContent =
    Object.keys(taken).length >= sys.options.length
      ? "Nothing else here wants anything from you."
      : sys.flavour;

  // options
  const groups = {};
  sys.options.forEach(o => { if(o.group) (groups[o.group] ||= []).push(o); });
  const done = new Set();
  let html = "";

  sys.options.forEach(o => {
    if (done.has(o.id)) return;
    if (o.group && !done.has("g:"+o.group)) {
      done.add("g:"+o.group);
      const members = groups[o.group];
      members.forEach(m => done.add(m.id));
      html += `<div class="group"><span class="group-label">one of these</span>` +
        members.map(m => optionHTML(m, o.group)).join("") + `</div>`;
    } else if (!o.group) {
      done.add(o.id);
      html += optionHTML(o, null);
    }
  });
  document.getElementById("options").innerHTML = html;
  document.getElementById("log").textContent = logLines.slice(-6).join("\n");
  wire();
}

function optionHTML(o, group){
  if (taken[o.id]) return taken[o.id];
  const closedBy = group && spentGroups[group];
  if (closedBy && closedBy !== o.id) {
    return `<div class="opt locked">
      <p class="opt-body">${o.body}</p>
      <p class="opt-label">${o.label}</p>
      <div class="locked-why">Unavailable — ${SYSTEMS[sysIndex].options.find(x=>x.id===closedBy)?.label || "another option"} taken</div></div>`;
  }
  const quote = o.quote ? `<p class="opt-body" style="color:var(--quote);font-style:italic">“${o.quote}”</p>` : "";
  const full = o.full ? `<div class="full">${o.full.split("\n\n").map(x=>`<p>${x}</p>`).join("")}</div>` : "";
  const choices = o.choices.map((c,i)=>{
    const cant = c.gate && ship.credits < c.gate.credits;
    const cls = cant ? "opt gated" : "opt";
    let badge = "";
    if (c.check) badge = badgeHTML(c.check);
    else if (c.gate) badge = `<div class="badge ${cant?'cant':''}">${c.gate.credits} credits · <span class="have">you have ${ship.credits}</span></div>`;
    else if (c.fight) badge = `<div class="badge">Fight${ship.attrs.sensors>=5?` · <span class="have">three contacts, one running hot</span>`:``}</div>`;
    return `<div class="${cls}" data-opt="${o.id}" data-choice="${i}" data-group="${group||''}">
        <p class="opt-label" style="font-size:12px">${c.label}</p>
        ${badge}
        ${cant?`<div class="gated-why">Not enough credits.</div>`:``}
        ${group && !c.decline ? `<div class="warn">Becomes unavailable</div>` : ``}
      </div>`;
  }).join("");
  return `<div class="opt-block"><p class="opt-body">${o.body}</p>
    <p class="opt-label">${o.label}</p>${full}${quote}${choices}</div>`;
}

function wire(){
  document.querySelectorAll(".tab").forEach(t =>
    t.onclick = () => { sysIndex = +t.dataset.sys; taken={}; spentGroups={}; render(); });

  document.querySelectorAll(".attr input").forEach(i =>
    i.oninput = () => { ship.attrs[i.dataset.attr] = Math.max(0, Math.min(10, +i.value||0)); render(); });

  document.querySelectorAll("[data-opt]").forEach(el => {
    const group = el.dataset.group;
    // ---- the signature interaction: preview what this forecloses
    // Enter updates the preview; it never clears it. Clearing is the GROUP's
    // job (below), so moving between two rows inside one box does not flash
    // the dimming off and back on. ENCOUNTER_FLOW.md ruling 1b.
    el.onmouseenter = () => {
      if (el.classList.contains("gated")) return;
      const decl = SYSTEMS[sysIndex].options.find(o=>o.id===el.dataset.opt)
        .choices[+el.dataset.choice].decline;
      document.querySelectorAll(".dimmed").forEach(d => d.classList.remove("dimmed"));
      if (!group || decl) return;   // declining forecloses nothing
      document.querySelectorAll(".group [data-opt]").forEach(other => {
        if (other.dataset.group === group && other.dataset.opt !== el.dataset.opt)
          other.classList.add("dimmed");
      });
    };

    el.onclick = () => {
      if (el.classList.contains("gated")) return;
      const sys = SYSTEMS[sysIndex];
      const opt = sys.options.find(o=>o.id===el.dataset.opt);
      const ch = opt.choices[+el.dataset.choice];
      let bandName = "flat", text, gain = {};

      if (ch.check){
        bandName = roll(ch.check.need, ship.attrs[ch.check.attr]);
        const b = ch.bands[bandName];
        text = b[0]; gain = b[1] || {};
        if (b[2]) logLines.push(`· placed "${b[2]}" on a system one ring deeper`);
      } else {
        text = ch.flat; gain = ch.gain || {};
        if (ch.places) logLines.push(`· placed "${ch.places}" on a system one ring deeper`);
        if (ch.fight) gain = {fight:true};
      }
      applyGain(gain);
      const ledger = fmtLedger(gain);
      taken[opt.id] = `<div class="outcome">
        <p class="band ${bandName.toLowerCase()}">${bandName === "flat" ? opt.label : bandName}</p>
        <p>${text}</p>
        ${ledger?`<div class="ledger">${ledger}</div>`:``}</div>`;
      if (opt.group && !ch.decline) spentGroups[opt.group] = opt.id;
      if (opt.group && ch.decline) spentGroups[opt.group] = "__declined";
      logLines.push(`${opt.label} — ${ch.label}${bandName!=="flat"?` (${bandName})`:``}`);
      render();
    };
  });

  document.querySelectorAll(".group").forEach(g =>
    g.onmouseleave = () =>
      document.querySelectorAll(".dimmed").forEach(d => d.classList.remove("dimmed")));

  document.getElementById("options").onmouseleave = () =>
    document.querySelectorAll(".dimmed").forEach(d => d.classList.remove("dimmed"));

  document.getElementById("leave").onclick = () => {
    logLines.push(`— jumped from ${SYSTEMS[sysIndex].name} —`);
    sysIndex = (sysIndex + 1) % SYSTEMS.length;
    taken = {}; spentGroups = {};
    ship.fuel = Math.max(0, ship.fuel - 3);
    render();
  };
}

render();
</script>
