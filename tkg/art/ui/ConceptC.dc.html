<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0a0e15; }
    a { color: #d97b29; } a:hover { color: #ff9d3d; }
    .lbl { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.18em; color: #4a5c72; text-transform: uppercase; }
    .num { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1280px; height: 720px; background: #080b11; color: #8fa3ba; font-family: Barlow, Helvetica, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; position: relative">

  <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid #1a2430; background: rgba(10,14,21,0.9); z-index: 3">
    <div style="display: flex; align-items: baseline; gap: 6px"><span class="lbl">HULL</span><span class="num" style="font-size: 15px; color: #c3d2e2">35</span></div>
    <div style="display: flex; align-items: baseline; gap: 6px"><span class="lbl">HEAT</span><span class="num" style="font-size: 15px; color: {{heatColor}}">{{heatNow}}</span><span class="num" style="font-size: 11px; color: #4a5c72">/12</span></div>
    <div style="display: flex; align-items: baseline; gap: 6px"><span class="lbl">SCRAP</span><span class="num" style="font-size: 15px; color: #c3d2e2">40</span></div>
    <div style="display: flex; align-items: baseline; gap: 6px"><span class="lbl">FUEL</span><span class="num" style="font-size: 15px; color: #c3d2e2">30</span></div>
    <div style="flex-grow: 1"></div>
    <span class="lbl" style="color: #6b7d94">LAYER 3 OF 8</span>
    <div style="display: flex; gap: 4px; align-items: center">
      <span style="width: 16px; height: 3px; background: #6b7d94"></span>
      <span style="width: 16px; height: 3px; background: #6b7d94"></span>
      <span style="width: 16px; height: 3px; background: #ff9d3d"></span>
      <span style="width: 16px; height: 3px; background: #22303f"></span>
      <span style="width: 16px; height: 3px; background: #22303f"></span>
      <span style="width: 16px; height: 3px; background: #22303f"></span>
      <span style="width: 16px; height: 3px; background: #22303f"></span>
      <span style="width: 16px; height: 3px; background: #22303f"></span>
    </div>
    <span class="lbl" style="color: #c98d7a">THE FARLIGHT</span>
  </div>

  <div style="flex-grow: 1; position: relative; min-height: 0; background: radial-gradient(80% 120% at 100% 50%, #1b1520 0%, #080b11 55%)">

    <svg style="position: absolute; top: 0; left: 0" width="1280" height="512" viewBox="0 0 1280 512" aria-label="Star chart">
      <g stroke="#1e2a38" stroke-width="1" fill="none">
        <path d="M110 256 L250 130 M110 256 L250 256 M110 256 L250 382"></path>
        <path d="M250 130 L400 130 M250 130 L400 256 M250 256 L400 130 M250 256 L400 382 M250 382 L400 382 M250 382 L400 256"></path>
        <path d="M400 130 L550 190 M400 256 L550 190 M400 256 L550 330 M400 382 L550 330"></path>
        <path d="M550 190 L700 120 M550 190 L700 256 M550 330 L700 256 M550 330 L700 392"></path>
        <path d="M700 120 L850 190 M700 256 L850 190 M700 256 L850 330 M700 392 L850 330"></path>
        <path d="M850 190 L1000 256 M850 330 L1000 256"></path>
        <path d="M1000 256 L1150 256"></path>
      </g>

      <g fill="#2a3644" stroke="#3d4d61" stroke-width="1">
        <rect x="242" y="122" width="16" height="16"></rect>
        <rect x="242" y="374" width="16" height="16"></rect>
        <rect x="392" y="122" width="16" height="16"></rect>
        <rect x="392" y="374" width="16" height="16"></rect>
        <rect x="542" y="182" width="16" height="16"></rect>
        <rect x="542" y="322" width="16" height="16"></rect>
        <rect x="692" y="112" width="16" height="16"></rect>
        <rect x="692" y="248" width="16" height="16"></rect>
        <rect x="692" y="384" width="16" height="16"></rect>
        <rect x="842" y="182" width="16" height="16"></rect>
        <rect x="842" y="322" width="16" height="16"></rect>
        <rect x="992" y="248" width="16" height="16"></rect>
      </g>

      <rect x="102" y="248" width="16" height="16" fill="#1a2430" stroke="#4a5c72"></rect>
      <rect x="392" y="248" width="16" height="16" fill="#3a2418" stroke="#6c542e"></rect>
      <rect x="1142" y="248" width="16" height="16" fill="#5c280c" stroke="#cc641c"></rect>

      <circle cx="250" cy="256" r="19" fill="none" stroke="#ff9d3d" stroke-width="1" opacity="0.35"></circle>
      <rect x="241" y="247" width="18" height="18" fill="#cc641c" stroke="#ff9d3d" stroke-width="1.5"></rect>

      <text x="250" y="292" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#ff9d3d">YOU</text>
      <text x="1150" y="292" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#c98d7a">FARLIGHT</text>
      <text x="400" y="292" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#6c542e">STATION</text>
    </svg>

    <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(8,11,17,0.78)"></div>

    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 856px; background: #0d131b; border: 1px solid #2a3644; box-shadow: 0 0 0 1px #080b11, 0 26px 70px rgba(0,0,0,0.75); display: flex; flex-direction: column">

      <div style="display: flex; align-items: center; gap: 11px; padding: 11px 18px; border-bottom: 1px solid #1e2a38; background: #10161e">
        <span style="width: 7px; height: 7px; background: #d64a3a"></span>
        <span class="lbl" style="color: #c98d7a; letter-spacing: 0.2em">ENGAGED — FRONTIER, DANGER 1</span>
        <div style="flex-grow: 1"></div>
        <span class="lbl">CHART LOCKED UNTIL RESOLVED</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 38px; gap: 20px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 9px">
          <svg width="216" height="108" viewBox="0 0 300 150" aria-label="Player hull">
            <ellipse cx="160" cy="82" rx="112" ry="42" fill="#232d3a" stroke="#0b0f16" stroke-width="2"></ellipse>
            <ellipse cx="160" cy="72" rx="112" ry="40" fill="#344254"></ellipse>
            <ellipse cx="160" cy="70" rx="98" ry="31" fill="#3d4d61"></ellipse>
            <rect x="96" y="52" width="52" height="20" fill="#4a3a20" stroke="#2c2212"></rect>
            <rect x="168" y="48" width="40" height="22" fill="#2e3b4b"></rect>
            <rect x="122" y="86" width="76" height="4" fill="#cc641c"></rect>
            <rect x="20" y="64" width="28" height="5" fill="#ff9d3d"></rect>
            <rect x="20" y="82" width="28" height="5" fill="#ff9d3d"></rect>
            <rect x="236" y="66" width="18" height="9" fill="#8ec8e6"></rect>
          </svg>
          <div style="display: flex; align-items: center; gap: 8px">
            <span class="num" style="font-size: 17px; color: #c3d2e2">35</span>
            <span class="lbl">HULL</span>
            <span style="width: 1px; height: 13px; background: #2a3644"></span>
            <span class="num" style="font-size: 17px; color: {{heatColor}}">{{heatNow}}</span>
            <span class="lbl">HEAT</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span class="lbl" style="letter-spacing: 0.24em">VS</span>
          <div style="width: 1px; height: 54px; background: #2a3644"></div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 9px">
          <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #7a3a30; background: rgba(122,58,48,0.16); padding: 6px 11px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c98d7a" stroke-width="2" stroke-linecap="round"><path d="M4 20 L20 4"></path><path d="M15 4h5v5"></path></svg>
            <span class="num" style="font-size: 15px; color: #c98d7a">8</span>
            <span style="font-size: 11px; color: #8a6a62">x 2 — strafing run</span>
          </div>
          <svg width="196" height="102" viewBox="0 0 230 120" aria-label="Rustjaw Cutter">
            <path d="M30 60 L96 34 L186 44 L206 60 L186 78 L96 88 Z" fill="#2a2119" stroke="#0b0f16" stroke-width="2"></path>
            <path d="M96 34 L186 44 L206 60 L100 56 Z" fill="#3b2e20"></path>
            <rect x="112" y="48" width="44" height="10" fill="#4a3a20"></rect>
            <rect x="26" y="54" width="26" height="5" fill="#d64a3a"></rect>
            <circle cx="176" cy="59" r="4" fill="#8ec8e6"></circle>
          </svg>
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-family: 'Saira Condensed', sans-serif; font-size: 15px; letter-spacing: 0.06em; color: #c98d7a; text-transform: uppercase">Rustjaw Cutter</span>
            <span class="num" style="font-size: 12px; color: #6b7d94">27/40</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="height: 164px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #0b1017; border-top: 1px solid #1e2a38; z-index: 3">
    <div style="display: flex; flex-direction: column; gap: 5px; width: 84px; flex: none">
      <span class="lbl">ENERGY</span>
      <div style="display: flex; gap: 4px">
        <span style="width: 10px; height: 10px; background: #ff9d3d"></span>
        <span style="width: 10px; height: 10px; background: #ff9d3d"></span>
        <span style="width: 10px; height: 10px; background: #ff9d3d"></span>
        <span style="width: 10px; height: 10px; border: 1px solid #22303f"></span>
        <span style="width: 10px; height: 10px; border: 1px solid #22303f"></span>
      </div>
    </div>
    <div style="display: flex; gap: 10px; flex-grow: 1; align-items: stretch; height: 128px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
        <div style="flex: 1; background: #111823; border: 1px solid #22303f; border-left: 3px solid {{c.accent}}; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; box-sizing: border-box">
          <div style="display: flex; align-items: center; gap: 7px">
            <span class="num" style="width: 19px; height: 19px; border: 1px solid #ff9d3d; color: #ff9d3d; font-size: 11px; display: grid; place-items: center">{{c.energy}}</span>
            <span style="font-family: 'Saira Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.03em; color: #c3d2e2; text-transform: uppercase">{{c.name}}</span>
          </div>
          <div style="font-size: 11px; line-height: 1.4; color: #8fa3ba">{{c.text}}</div>
          <div style="margin-top: auto; display: flex; align-items: center"><span class="lbl" style="color: {{c.accent}}">{{c.kind}}</span><div style="flex-grow: 1"></div><span class="num" style="font-size: 10px; color: {{c.heatColor}}">{{c.heatLabel}}</span></div>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"heat":{"editor":"int","default":4,"min":0,"max":16,"section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const cap = 12;
    const h = this.props.heat ?? 4;
    const over = h > cap;
    return {
      heatNow: String(h),
      heatColor: over ? '#ff9d3d' : (h > cap * 0.66 ? '#d97b29' : '#6b7d94'),
      cards: [
        { name: 'Suppressing Fire', energy: '1', text: 'Deal 3 damage twice. Salvo +2.', kind: 'BALLISTIC', heatLabel: 'cold', heatColor: '#4a5c72', accent: '#6b7d94' },
        { name: 'Charged Slug', energy: '2', text: 'Charge 1. Then deal 16.', kind: 'ORDNANCE', heatLabel: '+3 heat', heatColor: '#d97b29', accent: '#d97b29' },
        { name: 'Brace', energy: '1', text: 'Gain 5 armor. 1 heat a turn to hold.', kind: 'ARMOR', heatLabel: 'upkeep', heatColor: '#d97b29', accent: '#4d7a63' },
        { name: 'Emergency Vent', energy: '0', text: 'Vent 4 heat. Draw a card.', kind: 'UTILITY', heatLabel: '-4 heat', heatColor: '#7fb89a', accent: '#7fb89a' },
        { name: 'Suppressing Fire', energy: '1', text: 'Deal 3 damage twice. Salvo +2.', kind: 'BALLISTIC', heatLabel: 'cold', heatColor: '#4a5c72', accent: '#6b7d94' }
      ]
    };
  }
}
</script>
</body>
</html>
