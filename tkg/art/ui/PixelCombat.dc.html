<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #0a0e15; }
    a { color: #d97b29; } a:hover { color: #ff9d3d; }
    /* Everything sits on a 2px grid: a 640x360 canvas drawn at 2x.
       Silkscreen is an 8px face, so 16px keeps type and chrome on the
       same pixel density -- mixing scales is what makes pixel UI look wrong. */
    .px { font-family: Silkscreen, "Courier New", monospace; }
    .bevel { box-shadow: inset 2px 2px 0 #3d4d61, inset -2px -2px 0 #080b11; }
    .bevel-in { box-shadow: inset 2px 2px 0 #080b11, inset -2px -2px 0 #2a3644; }
    .dither { background-image: repeating-linear-gradient(45deg, rgba(143,163,186,0.035) 0 2px, transparent 2px 4px); }
    svg { shape-rendering: crispEdges; }
  </style>
</helmet>

<div class="px" style="width: 1280px; height: 720px; background: #0a0e15; color: #8fa3ba; font-size: 16px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; image-rendering: pixelated">

  <!-- HUD -->
  <div class="bevel dither" style="height: 56px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #1a2430">

    <div style="display: flex; gap: 6px; align-items: center">
      <div class="bevel-in" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #10161f; opacity: 0.5">
        <svg width="16" height="16" viewBox="0 0 8 8"><rect x="1" y="3" width="6" height="2" fill="#4a5c72"></rect><rect x="2" y="2" width="4" height="1" fill="#4a5c72"></rect><rect x="0" y="4" width="1" height="1" fill="#4a5c72"></rect></svg>
        <span style="font-size: 16px; color: #4a5c72">SHIP</span>
      </div>
      <div class="bevel-in" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #10161f">
        <svg width="16" height="16" viewBox="0 0 8 8"><rect x="0" y="2" width="2" height="2" fill="#8fa3ba"></rect><rect x="3" y="0" width="2" height="2" fill="#8fa3ba"></rect><rect x="6" y="3" width="2" height="2" fill="#8fa3ba"></rect><rect x="2" y="5" width="2" height="2" fill="#8fa3ba"></rect><rect x="2" y="2" width="1" height="1" fill="#3d4d61"></rect><rect x="5" y="3" width="1" height="1" fill="#3d4d61"></rect></svg>
        <span style="font-size: 16px; color: #c3d2e2">MAP</span>
      </div>
    </div>

    <div style="width: 2px; height: 24px; background: #10161f"></div>

    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 16px; color: #6b7d94">HULL</span>
      <span style="font-size: 16px; color: #c3d2e2">35/35</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 16px; color: #6b7d94">HEAT</span>
      <div style="display: flex; gap: 2px; align-items: center">
        <sc-for list="{{heatBoxes}}" as="b" hint-placeholder-count="12">
          <span style="width: 12px; height: 18px; background: {{b.bg}}; box-shadow: inset 2px 2px 0 {{b.hi}}, inset -2px -2px 0 {{b.lo}}"></span>
        </sc-for>
        <span style="width: 2px; height: 22px; background: #8fa3ba; margin: 0 4px"></span>
        <sc-for list="{{overBoxes}}" as="b" hint-placeholder-count="0">
          <span style="width: 12px; height: 18px; background: {{b.bg}}; box-shadow: inset 2px 2px 0 {{b.hi}}, inset -2px -2px 0 {{b.lo}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 16px; color: {{heatColor}}">{{heatReadout}}</span>
    </div>

    <div style="flex-grow: 1"></div>
    <span style="font-size: 16px; color: #6b7d94">SCRAP <span style="color: #c3d2e2">40</span></span>
    <span style="font-size: 16px; color: #6b7d94">FUEL <span style="color: #c3d2e2">30</span></span>
    <div class="bevel-in" style="padding: 5px 9px; background: #2c2212"><span style="font-size: 16px; color: #bc9a5c">KORVAN 5</span></div>
  </div>

  <!-- SPACE -->
  <div style="flex-grow: 1; position: relative; background: #0a0e15; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; overflow: hidden">

    <svg style="position: absolute; top: 0; left: 0" width="1280" height="392" viewBox="0 0 640 196">
      <rect x="0" y="0" width="640" height="196" fill="#0d121b"></rect>
      <rect x="0" y="0" width="640" height="196" fill="#101823" opacity="0.5"></rect>
      <g fill="#151d28">
        <rect x="380" y="20" width="180" height="2"></rect><rect x="360" y="40" width="220" height="2"></rect>
        <rect x="400" y="150" width="160" height="2"></rect>
      </g>
      <g fill="#8fa3ba">
        <rect x="42" y="30" width="2" height="2"></rect><rect x="118" y="72" width="2" height="2"></rect>
        <rect x="196" y="24" width="2" height="2"></rect><rect x="288" y="112" width="2" height="2"></rect>
        <rect x="352" y="52" width="2" height="2"></rect><rect x="452" y="132" width="2" height="2"></rect>
        <rect x="540" y="38" width="2" height="2"></rect><rect x="596" y="94" width="2" height="2"></rect>
      </g>
      <g fill="#4a5c72">
        <rect x="76" y="150" width="2" height="2"></rect><rect x="242" y="166" width="2" height="2"></rect>
        <rect x="500" y="70" width="2" height="2"></rect><rect x="620" y="150" width="2" height="2"></rect>
      </g>
    </svg>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <svg width="320" height="160" viewBox="0 0 160 80" aria-label="Player hull">
        <rect x="26" y="34" width="112" height="22" fill="#232d3a"></rect>
        <rect x="30" y="30" width="104" height="4" fill="#3d4d61"></rect>
        <rect x="34" y="26" width="92" height="4" fill="#344254"></rect>
        <rect x="42" y="22" width="70" height="4" fill="#3d4d61"></rect>
        <rect x="26" y="56" width="112" height="4" fill="#10161f"></rect>
        <rect x="52" y="18" width="26" height="8" fill="#4a3a20"></rect>
        <rect x="54" y="16" width="22" height="2" fill="#6c542e"></rect>
        <rect x="88" y="18" width="18" height="8" fill="#2e3b4b"></rect>
        <rect x="110" y="26" width="16" height="4" fill="#1a1e26"></rect>
        <rect x="60" y="42" width="40" height="2" fill="#cc641c"></rect>
        <rect x="66" y="48" width="28" height="2" fill="#964214"></rect>
        <rect x="14" y="32" width="12" height="4" fill="#3a404c"></rect>
        <rect x="14" y="46" width="12" height="4" fill="#3a404c"></rect>
        <rect x="6" y="32" width="8" height="4" fill="#ff9d3d"></rect>
        <rect x="6" y="46" width="8" height="4" fill="#ff9d3d"></rect>
        <rect x="0" y="33" width="6" height="2" fill="#cc641c"></rect>
        <rect x="0" y="47" width="6" height="2" fill="#cc641c"></rect>
        <rect x="126" y="34" width="8" height="4" fill="#8ec8e6"></rect>
        <rect x="40" y="50" width="2" height="6" fill="#22303f"></rect>
        <rect x="104" y="50" width="2" height="6" fill="#22303f"></rect>
      </svg>
      <span style="font-size: 16px; color: #4a5c72">C-TIER MEDIUM</span>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div class="bevel-in" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2a1512">
        <svg width="16" height="16" viewBox="0 0 8 8"><rect x="1" y="6" width="2" height="1" fill="#c98d7a"></rect><rect x="2" y="5" width="2" height="1" fill="#c98d7a"></rect><rect x="3" y="4" width="2" height="1" fill="#c98d7a"></rect><rect x="4" y="3" width="2" height="1" fill="#c98d7a"></rect><rect x="5" y="1" width="2" height="2" fill="#c98d7a"></rect></svg>
        <span style="font-size: 16px; color: #c98d7a">8 x2</span>
      </div>
      <svg width="256" height="128" viewBox="0 0 128 64" aria-label="Rustjaw Cutter">
        <rect x="18" y="26" width="88" height="14" fill="#2a2119"></rect>
        <rect x="24" y="22" width="76" height="4" fill="#3b2e20"></rect>
        <rect x="34" y="18" width="52" height="4" fill="#4a3a20"></rect>
        <rect x="18" y="40" width="88" height="4" fill="#0b0f16"></rect>
        <rect x="106" y="28" width="10" height="8" fill="#3b2e20"></rect>
        <rect x="116" y="30" width="6" height="4" fill="#2a2119"></rect>
        <rect x="10" y="28" width="8" height="4" fill="#d64a3a"></rect>
        <rect x="4" y="29" width="6" height="2" fill="#964214"></rect>
        <rect x="92" y="28" width="6" height="4" fill="#8ec8e6"></rect>
        <rect x="46" y="30" width="24" height="4" fill="#6c542e"></rect>
      </svg>
      <span style="font-size: 24px; color: #c98d7a">RUSTJAW CUTTER</span>
      <div class="bevel-in" style="width: 256px; height: 16px; background: #10161f; position: relative">
        <div style="position: absolute; top: 2px; bottom: 2px; left: 2px; width: 172px; background: #c98d7a"></div>
      </div>
      <span style="font-size: 16px; color: #6b7d94">27/40</span>
    </div>
  </div>

  <!-- CONTEXT -->
  <div class="bevel dither" style="height: 48px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #1a2430">
    <span style="font-size: 16px; color: #6b7d94">INTENT</span>
    <span style="font-size: 16px; color: #c3d2e2">BANKING FOR A SECOND PASS</span>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 16px; color: #6b7d94">ENERGY</span>
    <div style="display: flex; gap: 2px">
      <span style="width: 12px; height: 18px; background: #ff9d3d; box-shadow: inset 2px 2px 0 #ffd28a, inset -2px -2px 0 #964214"></span>
      <span style="width: 12px; height: 18px; background: #ff9d3d; box-shadow: inset 2px 2px 0 #ffd28a, inset -2px -2px 0 #964214"></span>
      <span style="width: 12px; height: 18px; background: #ff9d3d; box-shadow: inset 2px 2px 0 #ffd28a, inset -2px -2px 0 #964214"></span>
      <span style="width: 12px; height: 18px; background: #10161f; box-shadow: inset 2px 2px 0 #080b11, inset -2px -2px 0 #2a3644"></span>
      <span style="width: 12px; height: 18px; background: #10161f; box-shadow: inset 2px 2px 0 #080b11, inset -2px -2px 0 #2a3644"></span>
    </div>
    <span style="font-size: 16px; color: #ff9d3d">3/5</span>
  </div>

  <!-- HAND -->
  <div style="height: 190px; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; background: #0d121b">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <div class="bevel dither" style="width: 176px; height: 154px; background: #1a2430; display: flex; flex-direction: column; gap: 6px; padding: 10px; box-sizing: border-box">
        <div style="display: flex; align-items: center; gap: 6px">
          <span class="bevel-in" style="width: 24px; height: 24px; background: #4a2a0c; color: #ffd28a; font-size: 16px; display: grid; place-items: center">{{c.energy}}</span>
          <span style="font-size: 16px; color: #c3d2e2; line-height: 1.1">{{c.name}}</span>
        </div>
        <div style="height: 2px; background: {{c.accent}}"></div>
        <div style="font-size: 16px; line-height: 1.35; color: #8fa3ba; white-space: pre-line">{{c.text}}</div>
        <div style="margin-top: auto; display: flex; align-items: center">
          <span style="font-size: 16px; color: {{c.heatColor}}">{{c.heatLabel}}</span>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"heat":{"editor":"int","default":4,"min":0,"max":16,"section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const cap = 12;
    const h = this.props.heat ?? 4;
    const over = h > cap;

    const heatBoxes = [];
    for (let i = 0; i < cap; i++) {
      const filled = i < h;
      const hot = i >= cap * 0.66;
      if (!filled) { heatBoxes.push({ bg: '#10161f', hi: '#080b11', lo: '#2a3644' }); }
      else if (hot) { heatBoxes.push({ bg: '#d97b29', hi: '#ffd28a', lo: '#964214' }); }
      else { heatBoxes.push({ bg: '#6b7d94', hi: '#8fa3ba', lo: '#3d4d61' }); }
    }
    const overBoxes = [];
    for (let i = 0; i < Math.max(0, h - cap); i++) {
      overBoxes.push({ bg: '#d64a3a', hi: '#ff9d3d', lo: '#5c280c' });
    }

    return {
      heatBoxes: heatBoxes,
      overBoxes: overBoxes,
      heatReadout: over ? (h + ' -' + (h - cap) + 'HP') : (h + '/' + cap),
      heatColor: over ? '#ff9d3d' : (h > cap * 0.66 ? '#d97b29' : '#6b7d94'),
      cards: [
        { name: 'SUPPRESS', energy: '1', text: '3 DMG x2\nSALVO +2', heatLabel: 'COLD', heatColor: '#4a5c72', accent: '#6b7d94' },
        { name: 'SLUG', energy: '2', text: 'CHARGE 1\nTHEN 16', heatLabel: '+3 HEAT', heatColor: '#d97b29', accent: '#d97b29' },
        { name: 'BRACE', energy: '1', text: '5 ARMOR\n1 HEAT/TURN', heatLabel: 'UPKEEP', heatColor: '#d97b29', accent: '#4d7a63' },
        { name: 'VENT', energy: '0', text: 'VENT 4\nDRAW 1', heatLabel: '-4 HEAT', heatColor: '#7fb89a', accent: '#7fb89a' },
        { name: 'SUPPRESS', energy: '1', text: '3 DMG x2\nSALVO +2', heatLabel: 'COLD', heatColor: '#4a5c72', accent: '#6b7d94' }
      ]
    };
  }
}
</script>
</body>
</html>
