<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0a0e15; }
    a { color: #d97b29; } a:hover { color: #ff9d3d; }
    .lbl { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.18em; color: #4a5c72; text-transform: uppercase; }
    .num { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1280px; height: 720px; background: #0a0e15; color: #8fa3ba; font-family: Barlow, Helvetica, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

  <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 20px; padding: 0 18px; border-bottom: 1px solid #22303f; background: #0c111a">

    <div style="display: flex; gap: 6px; align-items: center">
      <div title="Locked during combat" style="display: flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid #1a2430; background: #0a0e15; opacity: 0.45">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4a5c72" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9" ry="5"></ellipse><path d="M3 12h18"></path></svg>
        <span class="lbl" style="color: #4a5c72">SHIP</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid #22303f; background: #111823">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8fa3ba" stroke-width="1.8"><path d="M4 7 L11 5 L17 9 L21 7"></path><circle cx="4" cy="7" r="1.6" fill="#8fa3ba"></circle><circle cx="11" cy="5" r="1.6" fill="#8fa3ba"></circle><circle cx="17" cy="9" r="1.6" fill="#8fa3ba"></circle><circle cx="21" cy="7" r="1.6" fill="#8fa3ba"></circle><path d="M11 5 L9 17"></path><circle cx="9" cy="17" r="1.6" fill="#8fa3ba"></circle></svg>
        <span class="lbl" style="color: #8fa3ba">MAP</span>
      </div>
    </div>
    <div style="width: 1px; height: 22px; background: #22303f"></div>

    <div style="display: flex; align-items: baseline; gap: 7px"><span class="lbl">HULL</span><span class="num" style="font-size: 17px; color: #c3d2e2">35</span><span class="num" style="font-size: 12px; color: #4a5c72">/35</span></div>
    <div style="display: flex; align-items: center; gap: 9px">
      <span class="lbl">HEAT</span>
      <div style="display: flex; gap: 2px; align-items: center">
        <sc-for list="{{heatBoxes}}" as="b" hint-placeholder-count="12">
          <span style="width: 10px; height: 15px; background: {{b.bg}}; border: 1px solid {{b.bd}}; box-sizing: border-box"></span>
        </sc-for>
        <span style="width: 1px; height: 19px; background: #6b7d94; margin: 0 3px"></span>
        <sc-for list="{{overBoxes}}" as="b" hint-placeholder-count="0">
          <span style="width: 10px; height: 15px; background: {{b.bg}}; border: 1px solid {{b.bd}}; box-sizing: border-box"></span>
        </sc-for>
      </div>
      <span class="num" style="font-size: 12px; color: {{heatColor}}">{{heatReadout}}</span>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: baseline; gap: 7px"><span class="lbl">SCRAP</span><span class="num" style="font-size: 15px; color: #c3d2e2">40</span></div>
    <div style="display: flex; align-items: baseline; gap: 7px"><span class="lbl">FUEL</span><span class="num" style="font-size: 15px; color: #c3d2e2">30</span></div>
    <div style="border: 1px solid #6c542e; color: #bc9a5c; font-size: 11px; letter-spacing: 0.08em; padding: 3px 9px">KORVAN 5</div>
  </div>

  <div style="flex-grow: 1; position: relative; background: radial-gradient(120% 90% at 78% 40%, #16202c 0%, #0a0e15 62%); display: flex; align-items: center; justify-content: space-between; padding: 0 70px; overflow: hidden">

    <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0.5; background-image: radial-gradient(1px 1px at 12% 24%, #8fa3ba, transparent), radial-gradient(1px 1px at 34% 68%, #6b7d94, transparent), radial-gradient(1px 1px at 58% 18%, #8fa3ba, transparent), radial-gradient(1px 1px at 71% 78%, #4a5c72, transparent), radial-gradient(1px 1px at 88% 42%, #8fa3ba, transparent), radial-gradient(1px 1px at 22% 86%, #4a5c72, transparent)"></div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="300" height="150" viewBox="0 0 300 150" aria-label="Player hull">
        <ellipse cx="160" cy="82" rx="112" ry="42" fill="#232d3a" stroke="#0b0f16" stroke-width="2"></ellipse>
        <ellipse cx="160" cy="72" rx="112" ry="40" fill="#344254"></ellipse>
        <ellipse cx="160" cy="70" rx="98" ry="31" fill="#3d4d61"></ellipse>
        <rect x="96" y="52" width="52" height="20" fill="#4a3a20" stroke="#2c2212"></rect>
        <rect x="168" y="48" width="40" height="22" fill="#2e3b4b" stroke="#22303f"></rect>
        <rect x="214" y="60" width="30" height="8" fill="#1a1e26"></rect>
        <rect x="122" y="86" width="76" height="4" fill="#cc641c"></rect>
        <rect x="132" y="94" width="52" height="3" fill="#964214"></rect>
        <rect x="48" y="62" width="30" height="9" fill="#3a404c"></rect>
        <rect x="48" y="80" width="30" height="9" fill="#3a404c"></rect>
        <rect x="20" y="64" width="28" height="5" fill="#ff9d3d"></rect>
        <rect x="20" y="82" width="28" height="5" fill="#ff9d3d"></rect>
        <rect x="236" y="66" width="18" height="9" fill="#8ec8e6"></rect>
      </svg>
      <div class="lbl" style="letter-spacing: 0.2em">C-TIER MEDIUM FRAME</div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="display: flex; align-items: center; gap: 9px; border: 1px solid #7a3a30; background: rgba(122,58,48,0.16); padding: 7px 13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c98d7a" stroke-width="2" stroke-linecap="round"><path d="M4 20 L20 4"></path><path d="M15 4h5v5"></path></svg>
        <span class="num" style="font-size: 17px; color: #c98d7a">8</span>
        <span style="font-size: 12px; color: #8a6a62">x 2</span>
        <span style="width: 1px; height: 14px; background: #7a3a30"></span>
        <span style="font-size: 12px; color: #8a6a62">strafing run</span>
      </div>
      <svg width="230" height="120" viewBox="0 0 230 120" aria-label="Rustjaw Cutter">
        <path d="M30 60 L96 34 L186 44 L206 60 L186 78 L96 88 Z" fill="#2a2119" stroke="#0b0f16" stroke-width="2"></path>
        <path d="M96 34 L186 44 L206 60 L100 56 Z" fill="#3b2e20"></path>
        <rect x="112" y="48" width="44" height="10" fill="#4a3a20"></rect>
        <rect x="26" y="54" width="26" height="5" fill="#d64a3a"></rect>
        <circle cx="176" cy="59" r="4" fill="#8ec8e6"></circle>
        <path d="M60 62 L92 62" stroke="#6c542e" stroke-width="3"></path>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
        <div style="font-family: 'Saira Condensed', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: 0.06em; color: #c98d7a; text-transform: uppercase">Rustjaw Cutter</div>
        <div style="width: 230px; height: 6px; background: #151d28; border: 1px solid #22303f; position: relative"><div style="position: absolute; top: 0; bottom: 0; left: 0; width: 68%; background: #c98d7a"></div></div>
        <div class="num" style="font-size: 11px; color: #6b7d94">27 / 40</div>
      </div>
    </div>
  </div>

  <div style="height: 40px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-top: 1px solid #22303f; border-bottom: 1px solid #22303f; background: #0c111a">
    <span class="lbl">INTENT</span>
    <span style="font-size: 13px; color: #8fa3ba">It banks hard and lines up a second pass. Bracing now costs 1 heat a turn to hold.</span>
    <div style="flex-grow: 1"></div>
    <span class="lbl">ENERGY</span>
    <div style="display: flex; gap: 2px; align-items: center">
      <span style="width: 10px; height: 15px; background: #ff9d3d; border: 1px solid #ff9d3d; box-sizing: border-box"></span>
      <span style="width: 10px; height: 15px; background: #ff9d3d; border: 1px solid #ff9d3d; box-sizing: border-box"></span>
      <span style="width: 10px; height: 15px; background: #ff9d3d; border: 1px solid #ff9d3d; box-sizing: border-box"></span>
      <span style="width: 10px; height: 15px; background: transparent; border: 1px solid #22303f; box-sizing: border-box"></span>
      <span style="width: 10px; height: 15px; background: transparent; border: 1px solid #22303f; box-sizing: border-box"></span>
    </div>
    <span class="num" style="font-size: 12px; color: #ff9d3d">3 / 5</span>
  </div>

  <div style="height: 186px; flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 22px; background: #0b1017">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <div style="width: 168px; height: 150px; background: #111823; border: 1px solid #22303f; border-top: 2px solid {{c.accent}}; display: flex; flex-direction: column; gap: 7px; padding: 11px 12px; box-sizing: border-box">
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="num" style="width: 21px; height: 21px; border: 1px solid #ff9d3d; color: #ff9d3d; font-size: 12px; display: grid; place-items: center">{{c.energy}}</span>
          <span style="font-family: 'Saira Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.03em; color: #c3d2e2; text-transform: uppercase">{{c.name}}</span>
        </div>
        <div style="font-size: 12px; line-height: 1.45; color: #8fa3ba">{{c.text}}</div>
        <div style="margin-top: auto; display: flex; gap: 6px; align-items: center">
          <span style="font-size: 10px; letter-spacing: 0.1em; color: {{c.accent}}; text-transform: uppercase">{{c.kind}}</span>
          <div style="flex-grow: 1"></div>
          <span class="num" style="font-size: 11px; color: {{c.heatColor}}">{{c.heatLabel}}</span>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"heat":{"editor":"int","default":4,"min":0,"max":16,"section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const cap = 12;
    const h = this.props.heat ?? 4;
    const over = h > cap;

    // Boxes state your situation without a number: steel while you are fine,
    // ember as you approach the cap, flare past it. Each box past the divider
    // is one hull you will pay at end of turn.
    const heatBoxes = [];
    for (let i = 0; i < cap; i++) {
      const filled = i < h;
      const zone = i >= cap * 0.66 ? '#d97b29' : '#6b7d94';
      heatBoxes.push({
        bg: filled ? zone : 'transparent',
        bd: filled ? zone : '#22303f'
      });
    }
    const overBoxes = [];
    for (let i = 0; i < Math.max(0, h - cap); i++) {
      overBoxes.push({ bg: '#d64a3a', bd: '#ff9d3d' });
    }

    return {
      heatNow: String(h),
      heatBoxes: heatBoxes,
      overBoxes: overBoxes,
      heatReadout: over ? (h + ' — ' + (h - cap) + ' hull') : (h + ' / ' + cap),
      heatColor: over ? '#ff9d3d' : (h > cap * 0.66 ? '#d97b29' : '#6b7d94'),
      cards: [
        { name: 'Suppressing Fire', energy: '1', text: 'Deal 3 damage twice. Salvo +2.', kind: 'ballistic', heatLabel: 'cold', heatColor: '#4a5c72', accent: '#6b7d94' },
        { name: 'Charged Slug', energy: '2', text: 'Charge 1. Then deal 16.', kind: 'ordnance', heatLabel: '+3 heat', heatColor: '#d97b29', accent: '#d97b29' },
        { name: 'Brace', energy: '1', text: 'Gain 5 armor. Costs 1 heat a turn to hold.', kind: 'armor', heatLabel: 'upkeep', heatColor: '#d97b29', accent: '#4d7a63' },
        { name: 'Emergency Vent', energy: '0', text: 'Vent 4 heat. Draw a card.', kind: 'utility', heatLabel: '-4 heat', heatColor: '#7fb89a', accent: '#7fb89a' },
        { name: 'Suppressing Fire', energy: '1', text: 'Deal 3 damage twice. Salvo +2.', kind: 'ballistic', heatLabel: 'cold', heatColor: '#4a5c72', accent: '#6b7d94' }
      ]
    };
  }
}
</script>
</body>
</html>
